name: Optimize new test assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize_new_tests.py"
      - ".github/workflows/optimize-new-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Rebuild direct-loading tests and trim vertical whitespace
        run: python scripts/optimize_new_tests.py

      - name: Commit optimized tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practice-test-3 2023-hybrid
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Fix new test loading and vertical whitespace"
            git push
          fi
