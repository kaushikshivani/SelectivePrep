name: Rebuild 2021 Sample assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/rebuild_2021_sample_vertical_only.py"
      - ".github/workflows/rebuild-2021-sample.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image/PDF dependencies
        run: pip install pymupdf pillow numpy

      - name: Rebuild image assets
        run: python scripts/rebuild_2021_sample_vertical_only.py

      - name: Commit rebuilt assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2021-sample/assets-*.js
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Fix 2021 Sample cropping to vertical-only"
            git push
          fi
