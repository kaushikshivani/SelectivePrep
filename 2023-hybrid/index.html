<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2023 Hybrid Test</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#182230;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:28px;box-shadow:0 1px 3px rgba(16,24,40,.08)}small{color:#667085}</style></head><body><div class="box"><h2>Loading 2023 Hybrid Test…</h2><small>Preparing the offline test assets.</small></div><script>(async()=>{const files=["part-001.txt","part-002.txt","part-003.txt","part-004.txt","part-005.txt","part-006.txt","part-007.txt","part-008.txt","part-009.txt","part-010.txt","part-011.txt","part-012.txt","part-013.txt","part-014.txt","part-015.txt","part-016.txt","part-017.txt"];let html="";for(const f of files){const r=await fetch(f);if(!r.ok)throw new Error("Unable to load "+f);html+=await r.text();}document.open();document.write(html);document.close();})().catch(e=>{document.body.innerHTML="<div class='box'><h2>Unable to load test</h2><p>"+e.message+"</p></div>";});</script></body></html>
