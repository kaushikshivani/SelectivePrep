<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2021 Selective High School Practice Test</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#667085;--accent:#2563eb;--ok:#15803d;--bad:#b42318;--line:#d0d5dd}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:16px;justify-content:space-between}.brand{font-weight:800}.timer{font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:900;padding:8px 14px;background:#111827;border:2px solid #fff;border-radius:10px;min-width:112px;text-align:center}.timer::before{content:'TIME LEFT ';font-size:.68rem;font-weight:800;display:block;letter-spacing:.04em}.timer.warn{background:#b45309;color:#fff;border-color:#fde68a}.timer.critical{background:#b91c1c;color:#fff;border-color:#fecaca;animation:pulseTimer 1s infinite}@keyframes pulseTimer{50%{transform:scale(1.04)}}.wrap{max-width:1400px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.08);padding:18px}.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}.subject-card h3{margin:0 0 8px}.status{color:var(--muted);margin-bottom:14px}.primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:700}.secondary{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;font-weight:700}.danger{background:#fff;border:1px solid #fda29b;color:var(--bad);border-radius:9px;padding:9px 13px}.exam{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.question-pane{min-width:0}.side{position:sticky;top:78px;height:fit-content}.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.qimg{width:auto;max-width:100%;height:auto;display:block;border:1px solid #ddd;border-radius:8px;background:#fff;margin:0 auto}.source-label,.question-label{font-weight:800;font-size:.78rem;letter-spacing:.06em;color:#475467;margin:10px 0 6px}.question-label{color:#1d4ed8}.context{display:grid;gap:10px;max-height:56vh;overflow:auto;border:1px solid #e4e7ec;border-radius:10px;padding:8px;background:#fafafa;margin-bottom:14px}.context img{width:100%;height:auto;border-radius:6px}.choice-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.choice{min-width:58px;padding:13px 18px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:800;font-size:1.05rem}.choice.sel{border-color:var(--accent);background:#eff6ff;color:#1d4ed8}.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.qnum{padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:700}.qnum.answered{background:#dcfce7;border-color:#86efac}.qnum.flagged{box-shadow:inset 0 0 0 3px #f59e0b}.qnum.current{outline:3px solid #2563eb}.flagbtn.active{background:#fffbeb;border-color:#f59e0b;color:#92400e}.legend{font-size:.82rem;color:var(--muted);line-height:1.6}.submitbox{border-top:1px solid #eee;padding-top:12px;margin-top:12px}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.metric{padding:14px;border:1px solid #e4e7ec;border-radius:10px;text-align:center}.metric b{display:block;font-size:1.5rem}.review-item{border:1px solid #e4e7ec;border-radius:12px;padding:14px;margin:12px 0;background:#fff}.wrong{color:var(--bad)}.correct{color:var(--ok)}.small{color:var(--muted);font-size:.9rem}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modal .card{max-width:560px;width:100%}.section-note{padding:10px 12px;background:#eff6ff;border-radius:8px;margin-bottom:10px;color:#1e3a8a}@media(max-width:900px){.exam{grid-template-columns:1fr}.side{position:static}.top{position:static}}
</style></head><body><div id="app"></div><script>
const DATA=__SELECTIVE_DATA__; const STORE='selective2021_state_v1'; let state=JSON.parse(localStorage.getItem(STORE)||'{}');
for(const id of Object.keys(DATA)){if(!state[id])state[id]={status:'not-started',answers:{},flags:{},current:1,remaining:DATA[id].duration*60,result:null};}
let active=null,tick=null; function save(){localStorage.setItem(STORE,JSON.stringify(state))} function fmt(sec){sec=Math.max(0,sec|0);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')} function stopTimer(){if(tick)clearInterval(tick);tick=null}
function home(){stopTimer();active=null;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">2021 Selective High School Practice Test</div><div>Saved locally in this browser</div></div><div class="wrap"><div class="card"><h1 style="margin-top:0">Choose a test</h1><p>Each subject has an independent 40-minute timer. Completed tests can be reviewed later.</p><div class="home-grid">${Object.entries(DATA).map(([id,s])=>{let st=state[id];let detail=st.status==='completed'?(st.result?`${st.result.score}/${s.count} (${Math.round(st.result.score/s.count*100)}%)`:'Completed'):st.status==='in-progress'?`In progress - ${fmt(st.remaining)} remaining`:'Not started';return `<div class="card subject-card"><h3>${s.name}</h3><div class="status">${detail}</div>${st.status==='completed'?`<button class="primary" onclick="showResult('${id}')">Results & Review</button> <button class="secondary" onclick="startTest('${id}',true)">Retake</button>`:`<button class="primary" onclick="startTest('${id}')">${st.status==='in-progress'?'Resume':'Start'}</button>`}</div>`}).join('')}</div><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="secondary" onclick="reviewAllWrong()">Review all incorrect questions</button><button class="danger" onclick="resetAll()">Reset all tests</button></div></div></div>`}
function resetSubject(id){if(confirm('Reset this subject and erase its saved attempt?')){state[id]={status:'not-started',answers:{},flags:{},current:1,remaining:DATA[id].duration*60,result:null};save();home()}} function resetAll(){if(confirm('Reset ALL saved progress and results?')){localStorage.removeItem(STORE);location.reload()}}
function startTest(id,retake=false){if(retake){if(!confirm('Start a new attempt? This replaces the saved result.'))return;state[id]={status:'not-started',answers:{},flags:{},current:1,remaining:DATA[id].duration*60,result:null}} active=id;let st=state[id];if(st.status==='not-started'){st.status='in-progress';st.remaining=DATA[id].duration*60;st.current=1;save()}renderExam();startTimer()}
function startTimer(){stopTimer();tick=setInterval(()=>{if(!active)return;let st=state[active];if(st.status!=='in-progress')return;st.remaining--;if(st.remaining<=0){st.remaining=0;save();stopTimer();submitNow(true,true);return}if(st.remaining%5===0)save();let el=document.getElementById('timer');if(el){el.textContent=fmt(st.remaining);el.classList.toggle('warn',st.remaining<=600&&st.remaining>300);el.classList.toggle('critical',st.remaining<=300)}},1000)}
function renderExam(){let id=active,s=DATA[id],st=state[id],q=st.current,qd=s.questions[q];let answered=Object.keys(st.answers).length,flagged=Object.values(st.flags).filter(Boolean).length;let context=(qd.context||[]).length?`<div class="context">${qd.context.map(x=>`<img src="${x}">`).join('')}</div>`:'';let note='';if(id==='reading'&&q>=15&&q<=20)note=`<div class="section-note"><b>Gap ${q}:</b> Choose sentence A-G for this gap. The passage and sentence list are above.</div>`;if(id==='reading'&&q>=21)note=`<div class="section-note"><b>Question ${q}:</b> Choose extract A-D. The question list and extracts are above.</div>`;let img=qd.image?`<img class="qimg" src="${qd.image}" alt="Question ${q}">`:'';document.getElementById('app').innerHTML=`<div class="top"><div class="brand">${s.name}</div><div>Question ${q} of ${s.count}</div><div id="timer" class="timer ${st.remaining<=300?'critical':st.remaining<=600?'warn':''}">${fmt(st.remaining)}</div></div><div class="wrap"><div class="exam"><main class="card question-pane"><div class="qhead"><h2 style="margin:0">Question ${q}</h2><button class="secondary flagbtn ${st.flags[q]?'active':''}" onclick="toggleFlag()">${st.flags[q]?'★ Flagged':'☆ Flag for review'}</button></div>${context?'<div class="source-label">SOURCE TEXT / INFORMATION</div>'+context:''}${note}${img?'<div class="question-label">CURRENT QUESTION</div>'+img:''}<div class="choice-row">${qd.choices.map(c=>`<button class="choice ${st.answers[q]===c?'sel':''}" onclick="answer('${c}')">${c}</button>`).join('')}</div><div class="navbtns"><button class="secondary" onclick="prevQ()" ${q===1?'disabled':''}>← Previous</button><button class="primary" onclick="nextQ()">${q===s.count?'Go to review':'Next →'}</button></div></main><aside class="card side"><b>Question navigator</b><div class="qgrid">${Array.from({length:s.count},(_,i)=>i+1).map(n=>`<button class="qnum ${st.answers[n]?'answered':''} ${st.flags[n]?'flagged':''} ${n===q?'current':''}" onclick="goQ(${n})">${n}</button>`).join('')}</div><div class="legend">Answered: ${answered} / ${s.count}<br>Flagged: ${flagged}</div><div class="submitbox"><button class="primary" style="width:100%" onclick="openSubmit()">Review & Submit</button><button class="danger" style="width:100%;margin-top:8px" onclick="resetSubject('${id}')">Reset this subject</button></div></aside></div></div>`}
function answer(c){state[active].answers[state[active].current]=c;save();renderExam()} function toggleFlag(){let st=state[active],q=st.current;st.flags[q]=!st.flags[q];save();renderExam()} function goQ(n){state[active].current=n;save();renderExam()} function prevQ(){goQ(Math.max(1,state[active].current-1))} function nextQ(){let s=DATA[active];if(state[active].current<s.count)goQ(state[active].current+1);else openSubmit()}
function openSubmit(){let id=active,s=DATA[id],st=state[id],unanswered=[];for(let i=1;i<=s.count;i++)if(!st.answers[i])unanswered.push(i);let modal=document.createElement('div');modal.className='modal';modal.id='submitModal';modal.innerHTML=`<div class="card"><h2>Submit ${s.name}?</h2><p>Answered: <b>${s.count-unanswered.length}/${s.count}</b></p>${unanswered.length?`<p class="wrong">Unanswered: ${unanswered.join(', ')}</p>`:'<p class="correct">All questions answered.</p>'}<p>You can either see the score now or save it and discuss it later.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="submitNow(true,false)">Submit & show result</button><button class="secondary" onclick="submitNow(false,false)">Submit & save for later</button><button class="secondary" onclick="document.getElementById('submitModal').remove()">Keep working</button></div></div>`;document.body.appendChild(modal)}
function submitNow(show=true,auto=false){let m=document.getElementById('submitModal');if(m)m.remove();let id=active,s=DATA[id],st=state[id],score=0,wrong=[],unanswered=[];for(let q=1;q<=s.count;q++){let a=st.answers[q]||null,correct=s.key[q-1];if(a===correct)score++;else{wrong.push(q);if(!a)unanswered.push(q)}}st.status='completed';st.result={score,wrong,unanswered,answers:{...st.answers},submittedAt:new Date().toISOString(),auto};save();stopTimer();if(show||auto)showResult(id);else home()}
function showResult(id){stopTimer();active=null;let s=DATA[id],r=state[id].result;if(!r){home();return}let incorrect=s.count-r.score-r.unanswered.length;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">${s.name} - Results</div><div>Saved attempt</div></div><div class="wrap"><div class="card"><h1 style="margin-top:0">${r.score} / ${s.count} - ${Math.round(r.score/s.count*100)}%</h1><div class="result-grid"><div class="metric"><b>${r.score}</b>Correct</div><div class="metric"><b>${incorrect}</b>Incorrect</div><div class="metric"><b>${r.unanswered.length}</b>Unanswered</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="reviewSubject('${id}')">Review incorrect questions</button><button class="secondary" onclick="home()">Return home</button><button class="danger" onclick="resetSubject('${id}')">Reset this subject</button></div></div></div>`}
function reviewSubject(id){let r=state[id].result;if(r)renderReview([{id:id,qs:r.wrong}],'Incorrect questions - '+DATA[id].name)} function reviewAllWrong(){let groups=[];for(const id of Object.keys(DATA)){let r=state[id].result;if(r&&r.wrong.length)groups.push({id:id,qs:r.wrong})}if(!groups.length){alert('No saved incorrect questions yet.');return}renderReview(groups,'All incorrect questions')}
function renderReview(groups,title){stopTimer();active=null;let html=`<div class="top"><div class="brand">${title}</div><button class="secondary" onclick="home()">Home</button></div><div class="wrap">`;for(const g of groups){let s=DATA[g.id],r=state[g.id].result;html+=`<h2>${s.name}</h2>`;for(const q of g.qs){let qd=s.questions[q],a=r.answers[q]||'Unanswered',c=s.key[q-1];let ctx=(qd.context||[]).length?`<details><summary>Show passage/context</summary><div class="context">${qd.context.map(x=>`<img src="${x}">`).join('')}</div></details>`:'';let note='';if(g.id==='reading'&&q>=15&&q<=20)note=`<div class="section-note">Gap ${q}</div>`;if(g.id==='reading'&&q>=21)note=`<div class="section-note">Extract matching question ${q}</div>`;html+=`<div class="review-item"><h3>Question ${q}</h3>${ctx}${note}${qd.image?`<img class="qimg" src="${qd.image}">`:''}<p>Your answer: <b class="wrong">${a}</b> &nbsp; Correct answer: <b class="correct">${c}</b></p>${state[g.id].flags[q]?'<p class="small">★ Flagged during the test.</p>':''}</div>`}}html+='</div>';document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}
window.addEventListener('beforeunload',save);home();
</script></body></html>
