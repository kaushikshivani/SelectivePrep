const STORE='selectiveprep_2021_sample_simple_v1';
let state=JSON.parse(localStorage.getItem(STORE)||'{}');
let currentSubject=null; let interval=null;
function getState(k){ if(!state[k]) state[k]={answers:{},flags:{},current:1,remaining:DATA[k].duration*60,submitted:false,result:null}; return state[k]; }
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }
function fmt(secs){ return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0'); }
const app=document.getElementById('app'); function asset(id){ return id ? ASSETS[id] : ''; }
function status(k){ const s=getState(k); return s.submitted?'Completed':Object.keys(s.answers).length?'In progress':'Not started'; }
function home(){ clearInterval(interval); app.innerHTML=`<div class="wrap"><div class="card"><a href="../">← All tests</a><h1>2021 – Sample Test</h1><p class="muted">Image-based version using the original uploaded paper only.</p></div><div class="grid">${Object.keys(DATA).map(k=>`<div class="card"><h3>${DATA[k].name}</h3><div class="muted">${status(k)}</div><div class="muted" style="margin-top:6px">${DATA[k].count} questions • ${DATA[k].duration} minutes</div><div style="margin-top:14px"><button class="primary" onclick="startSubject('${k}')">${getState(k).submitted?'View results':'Start / Continue'}</button></div><div style="margin-top:10px"><button class="danger" onclick="resetSubject('${k}')">Reset this subject</button></div></div>`).join('')}</div></div>`; }
function timerHTML(){ const st=getState(currentSubject); const cls=st.remaining<=300?'timer critical':st.remaining<=600?'timer warn':'timer'; return `<div id="timer" class="${cls}">${fmt(st.remaining)}</div>`; }
function startSubject(k){ currentSubject=k; const st=getState(k); if(st.submitted) return showResults(k); renderExam(); clearInterval(interval); interval=setInterval(()=>{ const s=getState(currentSubject); if(s.submitted) return; if(s.remaining>0){ s.remaining--; save(); const el=document.getElementById('timer'); if(el){ el.textContent=fmt(s.remaining); el.className=s.remaining<=300?'timer critical':s.remaining<=600?'timer warn':'timer'; }} else submitSubject(true); },1000); }
function renderExam(){ const subj=DATA[currentSubject], st=getState(currentSubject), q=subj.questions[st.current-1]; const context=(q.context||[]).map(id=>`<img class="qimg" src="${asset(id)}">`).join(''); const qimg=asset(q.img)?`<img class="qimg" src="${asset(q.img)}">`:''; app.innerHTML=`<div class="top"><div class="brand">2021 Sample • ${subj.name}</div>${timerHTML()}</div><div class="wrap"><div class="exam"><div class="card"><div class="row"><h2 style="margin:0">Question ${q.n} of ${subj.count}</h2><button class="secondary" onclick="toggleFlag()">${st.flags[q.n]?'★':'☆'} Flag for review</button></div>${context?'<div class="source-label">SOURCE TEXT / INFORMATION</div>'+context:''}${qimg?'<div class="question-label">CURRENT QUESTION</div>'+qimg:''}<div class="choices">${q.choices.map(c=>`<button class="choice ${st.answers[q.n]===c?'selected':''}" onclick="answerChoice('${c}')">${c}</button>`).join('')}</div><div class="row" style="margin-top:18px"><button class="secondary" onclick="prevQ()">← Previous</button><button class="secondary" onclick="nextQ()">Next →</button></div></div><div class="card sidebar"><h3 style="margin-top:0">Question navigator</h3><div class="qgrid">${subj.questions.map(item=>`<button class="qnav ${item.n===q.n?'current':''} ${st.answers[item.n]?'answered':''} ${st.flags[item.n]?'flagged':''}" onclick="goQ(${item.n})">${item.n}</button>`).join('')}</div><div class="muted">Answered: ${Object.keys(st.answers).length} / ${subj.count}</div><div class="muted">Flagged: ${Object.values(st.flags).filter(Boolean).length}</div><hr style="margin:14px 0;border:none;border-top:1px solid #eaecf0"><button class="primary" style="width:100%" onclick="submitSubject(false)">Review & Submit</button><button class="danger" style="width:100%;margin-top:10px" onclick="resetSubject('${currentSubject}')">Reset this subject</button></div></div></div>`; }
function answerChoice(c){ const st=getState(currentSubject); st.answers[st.current]=c; save(); renderExam(); }
function goQ(n){ getState(currentSubject).current=n; save(); renderExam(); }
function prevQ(){ const st=getState(currentSubject); if(st.current>1){ st.current--; save(); renderExam(); } }
function nextQ(){ const st=getState(currentSubject), max=DATA[currentSubject].count; if(st.current<max){ st.current++; save(); renderExam(); } }
function toggleFlag(){ const st=getState(currentSubject); st.flags[st.current]=!st.flags[st.current]; save(); renderExam(); }
function submitSubject(forced){ const subj=DATA[currentSubject], st=getState(currentSubject); if(!forced && !confirm('Submit this subject? Answers will be locked.')) return; let correct=0, wrong=0, unanswered=0; subj.questions.forEach((q,i)=>{ const ans=st.answers[q.n]; if(!ans) unanswered++; else if(ans===subj.key[i]) correct++; else wrong++; }); st.submitted=true; st.result={correct,wrong,unanswered,total:subj.count}; save(); clearInterval(interval); showResults(currentSubject); }
function showResults(k){ currentSubject=k; clearInterval(interval); const subj=DATA[k], st=getState(k), r=st.result; app.innerHTML=`<div class="wrap"><div class="card"><button class="secondary" onclick="home()">← Home</button><h1 style="margin-top:16px">${subj.name} results</h1><div class="results"><div class="metric"><b>${r.correct} / ${r.total}</b>Correct</div><div class="metric"><b>${Math.round((r.correct/r.total)*100)}%</b>Score</div><div class="metric"><b>${r.wrong}</b>Incorrect</div><div class="metric"><b>${r.unanswered}</b>Unanswered</div></div><div class="row"><button class="primary" onclick="reviewWrong('${k}')">Review incorrect questions</button><button class="secondary" onclick="home()">Back to home</button></div></div></div>`; }
function reviewWrong(k){ currentSubject=k; const subj=DATA[k], st=getState(k); const items=subj.questions.filter((q,i)=>st.answers[q.n]!==subj.key[i]).map(q=>`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">Question ${q.n}</h3><p>Your answer: <b class="wrong">${st.answers[q.n]||'Unanswered'}</b> &nbsp; Correct answer: <b class="correct">${subj.key[q.n-1]}</b></p>${(q.context||[]).length?'<div class="source-label">SOURCE TEXT / INFORMATION</div>'+(q.context||[]).map(id=>`<img class="qimg" src="${asset(id)}">`).join(''):''}${asset(q.img)?'<div class="question-label">CURRENT QUESTION</div><img class="qimg" src="'+asset(q.img)+'">':''}</div>`).join(''); app.innerHTML=`<div class="wrap"><div class="card"><button class="secondary" onclick="showResults('${k}')">← Back to results</button><h1 style="margin-top:16px">Review incorrect questions</h1><p class="muted">Only questions answered incorrectly or left blank are shown below.</p></div>${items}</div>`; }
function resetSubject(k){ if(!confirm('Reset this subject? This will clear saved answers and timer for this subject.')) return; delete state[k]; save(); home(); }
home();
