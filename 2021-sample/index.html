<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2021 Sample Test | Selective Prep</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182230;--muted:#667085;--blue:#2563eb;--green:#15803d;--red:#b42318;--line:#d0d5dd}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#111827;color:white;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800}
.timer{font-weight:900;font-variant-numeric:tabular-nums;border:2px solid white;border-radius:10px;padding:6px 12px;min-width:105px;text-align:center}.timer:before{content:"TIME LEFT ";display:block;font-size:.65rem}.warn{background:#b45309}.critical{background:#b91c1c;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.04)}}
.wrap{max-width:1400px;margin:auto;padding:18px}.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}.exam{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.side{position:sticky;top:74px;height:fit-content}
.primary{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:700}.secondary{background:white;border:1px solid var(--line);border-radius:9px;padding:10px 15px;font-weight:700}.danger{background:white;border:1px solid #fda29b;color:var(--red);border-radius:9px;padding:9px 13px}
.status,.small{color:var(--muted)}.paper{width:100%;height:70vh;border:1px solid #d0d5dd;border-radius:10px;background:white}.choices{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.choice{min-width:58px;padding:13px 18px;border:2px solid #cbd5e1;border-radius:10px;background:white;font-weight:800}.choice.sel{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.qnum{padding:8px 0;border:1px solid var(--line);background:white;border-radius:7px;font-weight:700}.qnum.answered{background:#dcfce7;border-color:#86efac}.qnum.flagged{box-shadow:inset 0 0 0 3px #f59e0b}.qnum.current{outline:3px solid var(--blue)}
.nav{display:flex;justify-content:space-between;gap:10px}.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.metric{border:1px solid #e4e7ec;border-radius:10px;padding:14px;text-align:center}.metric b{display:block;font-size:1.5rem}.wrong{color:var(--red)}.correct{color:var(--green)}
@media(max-width:900px){.exam{grid-template-columns:1fr}.side{position:static}.top{position:static}.paper{height:62vh}}
</style></head><body><div id="app"></div><script>
const TESTS={
 reading:{name:"Reading",count:30,minutes:40,key:"CABACDDBDCBADCC EAGDFDCABBCADBC".replaceAll(" ","").split(""),choices:"ABCD",url:"https://education.nsw.gov.au/content/dam/main-education/schooling/parents-and-carers/choosing-a-school-setting/selective-high-schools-and-opportunity-classes-parents/documents/shs-practice-tests-2026-entry/PT1_SHS_reading_questions.pdf"},
 maths:{name:"Mathematical Reasoning",count:35,minutes:40,key:"EAADBACC AADB BEEBBC CEBAD CADDDBECAD".replaceAll(" ","").split(""),choices:"ABCDE",url:"https://education.nsw.gov.au/content/dam/main-education/schooling/parents-and-carers/choosing-a-school-setting/selective-high-schools-and-opportunity-classes-parents/documents/shs-practice-tests-2026-entry/PT1_SHS_maths_questions_Final.pdf"},
 thinking:{name:"Thinking Skills",count:40,minutes:40,key:"AADACDABBBBCACBACCBBDBADADDDCCDDBBCC CABD".replaceAll(" ","").split(""),choices:"ABCD",url:"https://education.nsw.gov.au/content/dam/main-education/schooling/parents-and-carers/choosing-a-school-setting/selective-high-schools-and-opportunity-classes-parents/documents/shs-practice-tests-2026-entry/PT1_SHS_thinking_skills_questions.pdf"}
};
const MAP={
reading:[
[4,296],[4,398],[4,500],[4,602],[5,63],[5,165],[5,277],[5,379],
[9,106],[9,208],[9,310],[9,412],[9,514],[9,615],
[10,120],[10,240],[10,360],[10,480],[10,600],[11,70],
[12,70],[12,70],[12,70],[12,70],[12,70],[12,70],[12,70],[12,70],[12,70],[12,70]],
maths:[
[3,63],[3,278],[4,63],[4,274],[5,63],[5,507],[6,63],[7,63],[8,72],[8,421],[9,63],[10,63],[11,63],[12,63],[13,63],[13,286],[14,63],[15,63],[16,63],[17,63],[18,63],[19,63],[20,63],[21,63],[21,555],[22,63],[22,301],[23,63],[24,63],[25,63],[26,63],[27,63],[28,63],[29,63],[29,537]],
thinking:[
[3,63],[3,404],[4,63],[5,63],[6,63],[6,533],[7,63],[7,322],[8,63],[9,63],[10,63],[10,478],[11,63],[11,557],[12,63],[13,63],[13,531],[14,63],[14,452],[15,63],[15,328],[16,63],[17,63],[17,455],[18,63],[18,284],[19,63],[20,63],[21,63],[21,335],[22,63],[22,389],[23,63],[23,348],[24,63],[24,328],[25,63],[25,322],[26,63],[27,63]]
};
const PREFIX="sp_2021_sample_v2_";let state=JSON.parse(localStorage.getItem(PREFIX+"state")||"{}"),subject=null,timer=null,view="home";
const app=document.getElementById("app");const S=k=>state[k]||(state[k]={answers:{},flags:{},q:1,remaining:TESTS[k].minutes*60,submitted:false,result:null});const save=()=>localStorage.setItem(PREFIX+"state",JSON.stringify(state));
function status(k){const s=S(k);return s.submitted?"Completed":Object.keys(s.answers).length?"In progress":"Not started"}
function home(){clearInterval(timer);view="home";app.innerHTML='<div class="wrap"><div class="card"><a href="../">← All tests</a><h1>2021 – Sample Test</h1><p class="small">Different from the 11 March 2021 test already in the app. Progress is stored in this browser.</p></div><div class="grid">'+Object.keys(TESTS).map(k=>'<div class="card"><h3>'+TESTS[k].name+'</h3><div class="status">'+status(k)+'</div><button class="primary" onclick="start(\''+k+'\')">'+(S(k).submitted?"View results":status(k)==="In progress"?"Resume":"Start test")+'</button> '+(S(k).submitted?'<button class="secondary" onclick="review(\''+k+'\')">Review</button>':'')+'<div style="margin-top:12px"><button class="danger" onclick="resetSub(\''+k+'\')">Reset</button></div></div>').join("")+'</div></div>'}
function pdfUrl(k,q){const m=MAP[k][q-1],base=TESTS[k].url;return base+"#page="+m[0]+"&zoom=145,0,"+Math.max(0,m[1]-45)}
function start(k){subject=k;if(S(k).submitted)return results(k);view="exam";render();clearInterval(timer);timer=setInterval(()=>{let s=S(subject);if(view!=="exam"||s.submitted)return;if(s.remaining>0){s.remaining--;save();clock()}else submit(subject,true)},1000)}
function clock(){let e=document.getElementById("timer");if(!e)return;let r=S(subject).remaining;e.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");e.className="timer"+(r<=300?" critical":r<=600?" warn":"")}
function render(){let d=TESTS[subject],s=S(subject),q=s.q;let nums=Array.from({length:d.count},(_,i)=>i+1).map(n=>'<button class="qnum '+(s.answers[n]?"answered ":"")+(s.flags[n]?"flagged ":"")+(n===q?"current":"")+'" onclick="go('+n+')">'+n+'</button>').join("");let choices=d.choices.split("").map(c=>'<button class="choice '+(s.answers[q]===c?"sel":"")+'" onclick="answer(\''+c+'\')">'+c+'</button>').join("");app.innerHTML='<div class="top"><div class="brand">2021 Sample • '+d.name+'</div><div id="timer" class="timer"></div><button class="secondary" onclick="home()">Home</button></div><div class="wrap exam"><main class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Question '+q+' of '+d.count+'</h2><button class="secondary" onclick="flag()">'+(s.flags[q]?"★ Flagged":"☆ Flag")+'</button></div><p class="small">The original paper is focused on the page containing this question. For Reading questions 21–30, scroll within the PDF for the remaining extracts.</p><iframe class="paper" src="'+pdfUrl(subject,q)+'"></iframe><div class="choices">'+choices+'</div><div class="nav"><button class="secondary" '+(q===1?"disabled":"")+' onclick="go('+Math.max(1,q-1)+')">Previous</button><button class="primary" onclick="go('+Math.min(d.count,q+1)+')">'+(q===d.count?"Stay on last":"Next")+'</button></div></main><aside class="card side"><b>Questions</b><div class="qgrid">'+nums+'</div><p class="small">Green = answered. Orange border = flagged.</p><button class="primary" style="width:100%" onclick="submit(\''+subject+'\',false)">Submit test</button></aside></div>';clock()}
function answer(c){S(subject).answers[S(subject).q]=c;save();render()}function go(n){S(subject).q=n;save();render()}function flag(){let s=S(subject);s.flags[s.q]=!s.flags[s.q];save();render()}
function submit(k,forced){let d=TESTS[k],s=S(k);if(!forced&&!confirm("Submit this test? Answers will be locked."))return;let correct=0,wrong=0,unanswered=0;for(let i=1;i<=d.count;i++){let a=s.answers[i];if(!a)unanswered++;else if(a===d.key[i-1])correct++;else wrong++}s.submitted=true;s.result={correct,wrong,unanswered,total:d.count};save();clearInterval(timer);results(k)}
function results(k){subject=k;let d=TESTS[k],r=S(k).result;app.innerHTML='<div class="wrap"><div class="card"><button class="secondary" onclick="home()">← Home</button><h1>'+d.name+' result</h1><div class="metricgrid"><div class="metric"><b>'+r.correct+'/'+r.total+'</b>Correct</div><div class="metric"><b>'+r.wrong+'</b>Incorrect</div><div class="metric"><b>'+r.unanswered+'</b>Unanswered</div><div class="metric"><b>'+Math.round(r.correct/r.total*100)+'%</b>Score</div></div><button class="primary" onclick="review(\''+k+'\')">Review wrong/unanswered</button></div></div>'}
function review(k){subject=k;let d=TESTS[k],s=S(k),items=[];for(let i=1;i<=d.count;i++)if(s.answers[i]!==d.key[i-1])items.push('<div class="card" style="margin-top:12px"><h3>Question '+i+'</h3><p>Your answer: <b class="wrong">'+(s.answers[i]||"Unanswered")+'</b> &nbsp; Correct: <b class="correct">'+d.key[i-1]+'</b></p><a target="_blank" href="'+pdfUrl(k,i)+'">Open original paper at this question</a></div>');app.innerHTML='<div class="wrap"><button class="secondary" onclick="results(\''+k+'\')">← Result</button><h1>'+d.name+' review</h1>'+(items.join("")||"<p>No incorrect questions.</p>")+'</div>'}
function resetSub(k){if(!confirm("Reset all progress for this subject?"))return;delete state[k];save();home()}home();
</script></body></html>
