function home(){stopTimer();active=null;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">2021 Selective High School Practice Test</div><div>Saved locally in this browser</div></div><div class="wrap"><div class="card"><h1 style="margin-top:0">Choose a test</h1><p>Each subject has an independent 40-minute timer. Completed tests can be reviewed later.</p><div class="home-grid">${Object.entries(DATA).map(([id,s])=>{let st=state[id];let detail=st.status==='completed'?(st.result?`${st.result.score}/${s.count} (${Math.round(st.result.score/s.count*100)}%)`:'Completed'):st.status==='in-progress'?`In progress - ${fmt(st.remaining)} remaining`:'Not started';return `<div class="card subject-card"><h3>${s.name}</h3><div class="status">${detail}</div>${st.status==='completed'?`<button class="primary" onclick="showResult('${id}')">Results & Review</button> <button class="secondary" onclick="startTest('${id}',true)">Retake</button>`:`<button class="primary" onclick="startTest('${id}')">${st.status==='in-progress'?'Resume':'Start'}</button>`}</div>`}).join('')}</div><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="secondary" onclick="reviewAllWrong()">Review all incorrect questions</button><button class="danger" onclick="resetAll()">Reset all tests</button></div></div></div>`}
function resetSubject(id){if(confirm('Reset this subject and erase its saved attempt?')){state[id]={status:'not-started',answers:{},flags:{},current:1,remaining:DATA[id].duration*60,result:null};save();home()}} function resetAll(){if(confirm('Reset ALL saved progress and results?')){localStorage.removeItem(STORE);location.reload()}}
function startTest(id,retake=false){if(retake){if(!confirm('Start a new attempt? This replaces the saved result.'))return;state[id]={status:'not-started',answers:{},flags:{},current:1,remaining:DATA[id].duration*60,result:null}} active=id;let st=state[id];if(st.status==='not-started'){st.status='in-progress';st.remaining=DATA[id].duration*60;st.current=1;save()}renderExam();startTimer()}

utton>`).join('')}</div><div class="legend">Answered: ${answered} / ${s.count}<br>Flagged: ${flagged}</div><div class="submitbox"><button class="primary" style="width:100%" onclick="openSubmit()">Review & Submit</button><button class="danger" style="width:100%;margin-top:8px" onclick="resetSubject('${id}')">Reset this subject</button></div></aside></div></div>`}
function answer(c){state[active].answers[state[active].current]=c;save();renderExam()} function toggleFlag(){let st=state[active],q=st.current;st.flags[q]=!st.flags[q];save();renderExam()} function goQ(n){state[active].current=n;save();renderExam()} function prevQ(){goQ(Math.max(1,state[active].current-1))} function nextQ(){let s=DATA[active];if(state[active].current<s.count)goQ(state[active].current+1);else openSubmit()}
function openSubmit(){let id=active,s=DATA[id],st=state[id],unanswered=[];for(let i=1;i<=s.count;i++)if(!st.answers[i])unanswered.push(i);let modal=document.createElement('div');modal.className='modal';modal.id='submitModal';modal.innerHTML=`<div class="card"><h2>Submit ${s.name}?</h2><p>Answered: <b>${s.count-unanswered.length}/${s.count}</b></p>${unanswered.length?`<p class="wrong">Unanswered: ${unanswered.join(', ')}</p>`:'<p class="correct">All questions answered.</p>'}<p>You can either see the score now or save it and discuss it later.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="submitNow(true,false)">Submit & show result</button><button class="secondary" onclick="submitNow(false,false)">Submit & save for later</button><button class="secondary" onclick="document.getElementById('submitModal').remove()">Keep working</button></div></div>`;document.body.appendChild(modal)}
function submitNow(show=true,auto=false){let m=document.getElementById('submitModal');if(m)m.remove();let id=active,s=DATA[id],st=state[id],score=0,wrong=[],unanswered=[];for(let q=1;q<=s.count;q++){let a=st.answers[q]||null,correct=s.key[q-1];if(a===correct)score++;else{wrong.push(q);if(!a)unanswered.push(q)}}st.status='completed';st.result={score,wrong,unanswered,answers:{...st.answers},submittedAt:new Date().toISOString(),auto};save();stopTimer();if(show||auto)showResult(id);else home()}
function showResult(id){stopTimer();active=null;let s=DATA[id],r=state[id].result;if(!r){home();return}let incorrect=s.count-r.score-r.unanswered.length;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">${s.name} - Results</div><div>Saved attempt</div></div><div class="wrap"><div class="card"><h1 style="margin-top:0">${r.score} / ${s.count} - ${Math.round(r.score/s.count*100)}%</h1><div class="result-grid"><div class="metric"><b>${r.score}</b>Correct</div><div class="metric"><b>${incorrect}</b>Incorrect</div><div class="metric"><b>${r.unanswered.length}</b>Unanswered</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="reviewSubject('${id}')">Review incorrect questions</button><button class="secondary" onclick="home()">Return home</button><button class="danger" onclick="resetSubject('${id}')">Reset this subject</button></div></div></div>`}
function reviewSubject(id){let r=state[id].result;if(r)renderReview([{id:id,qs:r.wrong}],'Incorrect questions - '+DATA[id].name)} function reviewAllWrong(){let groups=[];for(const id of Object.keys(DATA)){let r=state[id].result;if(r&&r.wrong.length)groups.push({id:id,qs:r.wrong})}if(!groups.length){alert('No saved incorrect questions yet.');return}renderReview(groups,'All incorrect questions')}
function renderReview(groups,title){stopTimer();active=null;let html=`<div class="top"><div class="brand">${title}</div><button class="secondary" onclick="home()">Home</button></div><div class="wrap">`;for(const g of groups){let s=DATA[g.id],r=state[g.id].result;html+=`<h2>${s.name}</h2>`;for(const q of g.qs){let qd=s.questions[q],a=r.answers[q]||'Unanswered',c=s.key[q-1];let ctx=(qd.context||[]).length?`<details><summary>Show passage/context</summary><div class="context">${qd.context.map(x=>`<img src="${x}">`).join('')}</div></details>`:'';let note='';if(g.id==='reading'&&q>=15&&q<=20)note=`<div class="section-note">Gap ${q}</div>`;if(g.id==='reading'&&q>=21)note=`<div class="section-note">Extract matching question ${q}</div>`;html+=`<div class="review-item"><h3>Question ${q}</h3>${ctx}${note}${qd.image?`<img class="qimg" src="${qd.image}">`:''}<p>Your answer: <b class="wrong">${a}</b> &nbsp; Correct answer: <b class="correct">${c}</b></p>${state[g.id].flags[q]?'<p class="small">★ Flagged during the test.</p>':''}</div>`}}html+='</div>';document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}
window.addEventListener('beforeunload',save);home();
</script>
<script>
// Trim large blank PDF margins and isolated page-number/footer rows at display time.
function trimDisplayedImage(img){
  if(!img || img.dataset.trimmed==='1') return;
  img.dataset.trimmed='1';
  const run=()=>{
    try{
      const sw=img.naturalWidth, sh=img.naturalHeight;
      if(!sw||!sh) return;
      const scale=Math.min(1,900/sw);
      const w=Math.max(1,Math.round(sw*scale)), h=Math.max(1,Math.round(sh*scale));
      const scan=document.createElement('canvas'); scan.width=w; scan.height=h;
      const sx=scan.getContext('2d',{willReadFrequently:true}); sx.drawImage(img,0,0,w,h);
      const d=sx.getImageData(0,0,w,h).data;
      const row=new Uint32Array(h), col=new Uint32Array(w);
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const i=(y*w+x)*4; const lum=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
        if(lum<238){row[y]++; col[x]++;}
      }
      const rMin=Math.max(5,Math.floor(w*0.0025));
      const cMin=Math.max(3,Math.floor(h*0.002));
      const active=[]; for(let y=0;y<h;y++) if(row[y]>=rMin) active.push(y);
      if(!active.length) return;
      const runs=[]; let a=active[0], p=active[0];
      for(let i=1;i<active.length;i++){const y=active[i]; if(y-p>10){runs.push([a,p]);a=y;} p=y;} runs.push([a,p]);
      // Ignore a tiny isolated footer/page-number block after a large blank gap.
      if(runs.length>1){
        const last=runs[runs.length-1], prev=runs[runs.length-2];
        const gap=last[0]-prev[1], lastH=last[1]-last[0]+1;
        if(gap>Math.max(45,h*0.07) && lastH<Math.max(28,h*0.045)) runs.pop();
      }
      let top=Math.max(0,runs[0][0]-12), bottom=Math.min(h-1,runs[runs.length-1][1]+12);
      let xs=[]; for(let x=0;x<w;x++) if(col[x]>=cMin) xs.push(x);
      let left=0,right=w-1; if(xs.length){left=Math.max(0,xs[0]-12);right=Math.min(w-1,xs[xs.length-1]+12);}
      const sf=1/scale; const sl=Math.floor(left*sf), st=Math.floor(top*sf), sr=Math.ceil((right+1)*sf), sb=Math.ceil((bottom+1)*sf);
      if(sb-st>=sh*0.97 && sr-sl>=sw*0.97) return;
      const out=document.createElement('canvas'); out.width=sr-sl; out.height=sb-st;
      out.getContext('2d').drawImage(img,sl,st,out.width,out.height,0,0,out.width,out.height);
      img.src=out.toDataURL('image/jpeg',0.9);
    }catch(e){}
  };
  if(img.complete) run(); else img.addEventListener('load',run,{once:true});
}
function trimAllDisplayedImages(root=document){root.querySelectorAll?.('.qimg,.context img').forEach(trimDisplayedImage);}
const trimObserver=new MutationObserver(ms=>{for(const m of ms) for(const n of m.addedNodes){if(n.nodeType===1){if(n.matches?.('.qimg,.context img'))trimDisplayedImage(n);trimAllDisplayedImages(n);}}});
trimObserver.observe(document.documentElement,{childList:true,subtree:true});
</script>
