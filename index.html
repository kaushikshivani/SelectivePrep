<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Selective Prep</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f5f7fb;color:#182230}
    .wrap{max-width:900px;margin:60px auto;padding:24px}.hero,.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:28px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}h1,h2{margin-top:0}.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}.meta{color:#667085}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Selective Prep</h1>
      <p class="meta">NSW Selective practice test environment.</p>
    </div>
    <div class="grid">
      <div class="card">
        <h2>2021 – 11 March 2021</h2>
        <p class="meta">Reading, Mathematical Reasoning and Thinking Skills.</p>
        <a class="btn" href="./2021/">Open test</a>
      </div>
      <div class="card">
        <h2>2021 – Sample Test</h2>
        <p class="meta">A different complete 2021 version.</p>
        <a class="btn" href="./2021-sample/">Open test</a>
      </div>
    </div>
  </div>
</body>
</html>
